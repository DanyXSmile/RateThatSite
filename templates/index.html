<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Accedi - RateThatSite</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      text-align: center;
      width: 100%;
      max-width: 400px;
    }
    .brand {
      font-size: 1.8rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
    }
    .brand span { color: #ffc107; }
    .subtitle { color: #666; margin-bottom: 30px; font-size: 0.95rem; }
    .form-group { margin-bottom: 20px; text-align: left; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 5px; color: #444; }
    .form-control { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
    .btn-login { background: #28a745; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
    .btn-login:hover { background: #218838; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="brand">RateThatSite <span>⭐️</span></div>
    <div class="subtitle">Benvenuto! Inserisci il tuo nome per entrare nel sito</div>
    <form method="post" action="{{ url_for('login') }}">
      <div class="form-group">
        <label>Nome Utente:</label>
        <input class="form-control" type="text" name="username" required>
      </div>
      <button class="btn-login" type="submit">Entra nel Sito</button>
    </form>
  </div>
</body>
</html>

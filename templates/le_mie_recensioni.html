<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Le Mie Recensioni</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div style="max-width: 800px; margin: 4px auto; padding: 20px; font-family: sans-serif;">
        <h2>Profilo di {{ utente }}</h2>
        <h3>Le tue recensioni pubblicate:</h3>
        
        {% if not recensioni %}
            <p>Non hai ancora scritto nessuna recensione.</p>
        {% else %}
            {% for r in recensioni %}
            <div style="background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid #ffcc00;">
                <h4>Sito: <a href="{{ r[0] }}" target="_blank">{{ r[0] }}</a></h4>
                <p>Voto: {{ r[2] }}/5 ⭐️</p>
                <p><strong>Commento:</strong> {{ r[1] }}</p>
                
                {% if r[3] %}
                    <div style="margin-top: 10px;">
                        <img src="/static/uploads/{{ r[3] }}" alt="Foto allegata" style="max-width: 200px; border-radius: 4px; display: block;">
                    </div>
                {% endif %}
            </div>
            {% endfor %}
        {% endif %}
    </div>
</body>
</html>

<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Accedi - RateThatSite</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
      width: 90%;
      max-width: 400px;
    }
    .logo { font-size: 2.2rem; font-weight: 800; color: #1a1a1a; margin-bottom: 5px; }
    .logo span { color: #ffc107; }
    .subtitle { color: #6c757d; margin-bottom: 30px; font-size: 1rem; }
    .form-group { margin-bottom: 22px; text-align: left; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #495057; }
    .form-control { width: 100%; padding: 14px; border: 1px solid #ced4da; border-radius: 10px; box-sizing: border-box; font-size: 1rem; }
    .btn-login { background: #28a745; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; font-size: 1.05rem; }
    .btn-login:hover { background: #218838; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">RateThatSite <span>⭐️</span></div>
    <p class="subtitle">Inserisci il tuo nome per iniziare a cercare e recensire siti web</p>
    <form method="post" action="/login">
      <div class="form-group">
        <label for="username">Il tuo Nome Utente:</label>
        <input id="username" name="username" class="form-control" type="text" placeholder="Es. Maria123" required>
      </div>
      <button type="submit" class="btn-login">Entra nel Sito</button>
    </form>
  </div>
</body>
</html>
